networks:
  sia-net:
    name: sia-net

services:
  sia-core-api:
    image: ${SIA_CORE_API_IMAGE:-sia-core-api:latest} # to use a precompiled image instead of building; comment out if build is going to be used.
    build:
      context: ./sia-core-api
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
        PIPELINE_REF: ${PIPELINE_REF:-main}
      # Passed as a BuildKit secret, not a build ARG (IDX-006): an ARG's value
      # ends up in the image's history metadata even after any file that used
      # it is deleted. See secrets: below.
      secrets:
        - github_token
    container_name: sia-core-api
    # Run as an unprivileged user (see IDX-002). Must match the owner of the
    # bind-mounted host dirs; override APP_UID/APP_GID in .env and re-build if needed.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # Defence in depth (IDX-002): no privilege escalation, drop all Linux
    # capabilities (the API is a plain non-root Python process). Relax cap_drop
    # only if a dependency is shown to need a specific capability.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Bound log retention on the host (audit plan item: "revisar... periodos de
    # conservación de los registros"). Sanitized 5xx bodies still carry a
    # correlation id; the matching detail lives in these logs (IDX-001) - keep
    # them, but don't let them grow unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - 10083:10083
    environment:
      #NVIDIA_DRIVER_CAPABILITIES: compute,utility # needed in Lt2
      SOLR_URL: http://solr:8983
      SIA_MASTER_KEY: ${SIA_MASTER_KEY:-master-key-change-in-production}
      API_KEYS_FILE: /config/api_keys.json
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      # Must match the target of the pipeline_jobs.db bind mount below, or the
      # job store silently falls back to /mnt/data_place/pipeline_jobs.db.
      PIPELINE_DB_PATH: /data/pipeline_jobs.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - solr
    networks:
      - sia-net
    volumes:
      - ${SIA_DATA_DIR:-./data}/:/mnt/data_place:Z,U
      - ${SIA_BDNS_DATA_DIR:-./data_bdns}/:/mnt/data_bdns:Z,U
      - ./sia-config:/config:Z,U
      - ./db/data/sqlite3/pipeline_jobs.db:/data/pipeline_jobs.db:Z,U
    deploy:
      resources:
        limits:
          memory: 100GB
        # GPU reservation, optional - remove/leave commented for Lt2 or machines without a GPU
        #reservations:
        #  devices:
        #    - driver: nvidia
        #      device_ids: ["2"]
        #      capabilities: [gpu]
        # NOTE: under Podman use CDI instead of the docker `driver: nvidia` syntax above:
        #   devices:
        #     - nvidia.com/gpu=all

  solr:
    image: ${SOLR_IMAGE:-sia-solr:9.1.1} # to use a precompiled image instead of building; comment out if build is going to be used.
    build:
      context: ./solr-plugins/NP-solr-dist-plugin
    container_name: sia-solr
    restart: always
    security_opt:
      - no-new-privileges:true # IDX-002 (the official Solr image already runs as uid 8983)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ${SOLR_DATA_DIR:-./db/data/solr}:/var/solr:Z,U
      - ./solr-config:/opt/solr/server/solr:Z,U
      - ./solr-config/solr.in.sh:/etc/default/solr.in.sh:Z,U
    ports:
      - 10085:8983
    entrypoint:
      - docker-entrypoint.sh
      - solr
      - start
      - -f
      - -c
      - -z
      - zoo:2181
      - -a
      - "-Xdebug -Xrunjdwp:transport=dt_socket,server=y,suspend=n,address=1044 -Djute.maxbuffer=0x5000000"
    environment:
      - SOLR_OPTS=-Dsolr.jetty.request.header.size=65535
      - SOLR_JAVA_MEM=-Xms1g -Xmx1g
    networks:
      - sia-net
    deploy:
      resources:
        limits:
          memory: 100GB

  zoo:
    # Pinned by digest (IDX-006). zookeeper:latest as of 2025-07.
    # Fully qualified with the registry (docker.io/library/...): unlike Docker,
    # Podman does not assume Docker Hub for a bare digest reference.
    image: ${ZOOKEEPER_IMAGE:-docker.io/library/zookeeper@sha256:4c6f15fbd5491a3e01b0108c046891125553329a4956848ba3014cedff5386ee}
    container_name: sia-zoo
    restart: always
    security_opt:
      - no-new-privileges:true # IDX-002 (the official ZooKeeper image already runs as the `zookeeper` user)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    ports:
      - 10086:8080
      - 10087:2181
    environment:
      - JVMFLAGS=-Djute.maxbuffer=50000000
    volumes:
      - ./db/data/zoo/data:/data:Z,U
      - ./db/data/zoo/logs:/datalog:Z,U
    networks:
      - sia-net
    deploy:
      resources:
        limits:
          memory: 100GB

# Build-only secret (IDX-006): sourced from the GITHUB_TOKEN env var / .env,
# handed to the sia-core-api build as a BuildKit secret mount rather than a
# build ARG so its value never lands in the image's history metadata.
secrets:
  github_token:
    environment: GITHUB_TOKEN
